<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>მოვწიოთ რამე? 🌿</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* მუქი, კვამლისფერი და მწვანე გრადიენტი */
            background: linear-gradient(135deg, #132a13, #31572c, #4f772d);
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 3px solid #90a955;
            backdrop-filter: blur(5px);
        }

        h1 {
            color: #132a13;
            margin-bottom: 20px;
            font-size: 2rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        p {
            color: #31572c;
            margin-bottom: 30px;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 60px;
        }

        button {
            padding: 12px 35px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s ease;
        }

        #yesBtn {
            background-color: #4f772d;
            color: white;
            box-shadow: 0 5px 15px rgba(79, 119, 45, 0.4);
        }

        #yesBtn:hover {
            background-color: #90a955;
            transform: scale(1.05);
        }

        #noBtn {
            background-color: #e9ecef;
            color: #4f5d75;
            position: absolute;
            white-space: nowrap;
        }

        .hidden {
            display: none !important;
        }

        input[type="datetime-local"] {
            padding: 12px;
            border: 2px solid #90a955;
            border-radius: 10px;
            font-size: 1rem;
            color: #132a13;
            outline: none;
            margin-bottom: 20px;
            width: 100%;
            font-weight: bold;
        }

        input[type="datetime-local"]:focus {
            border-color: #4f772d;
        }

        #submitDate {
            background-color: #31572c;
            color: white;
            width: 100%;
            box-shadow: 0 5px 15px rgba(49, 87, 44, 0.4);
        }

        #submitDate:hover {
            background-color: #4f772d;
        }

        .smoke-emoji {
            font-size: 4rem;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <!-- ეტაპი 1: შეთავაზება -->
    <div id="questionCard" class="card">
        <div class="smoke-emoji">🍁💨</div>
        <h1>კაროჩე როდის მოვწიოთ პლანი?</h1>
        <p>უცებ გააძრე ეხლა თავი არიფასო... 😜</p>
        
        <div class="btn-container">
            <button id="yesBtn">დღეს 😮‍💨</button>
            <button id="noBtn">აღარ მოვწიოთ 🤫</button>
        </div>
    </div>

    <!-- ეტაპი 2: დროის შეთანხმება -->
    <div id="dateCard" class="card hidden">
        <div class="smoke-emoji">🔥🤙</div>
        <h1>გაასწორა! 🔥</h1>
        <p>აბა, როდის ჩავყაროთ? აარჩიე დრო:</p>
        
        <input type="datetime-local" id="datePicker">
        <button id="submitDate">შევთანხმდით 🤝</button>
    </div>

    <!-- ეტაპი 3: ფინალი -->
    <div id="finalCard" class="card hidden">
        <div class="smoke-emoji">🥦✨🕺</div>
        <h1>ბაზარი არაა!</h1>
        <p id="finalMessage"></p>
    </div>

    <script>
        const questionCard = document.getElementById('questionCard');
        const dateCard = document.getElementById('dateCard');
        const finalCard = document.getElementById('finalCard');
        
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const submitDate = document.getElementById('submitDate');
        const datePicker = document.getElementById('datePicker');
        const finalMessage = document.getElementById('finalMessage');

        // გაქცევის ლოგიკა
        function moveNoButton() {
            const padding = 60;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        // "კი" ღილაკი
        yesBtn.addEventListener('click', () => {
            questionCard.classList.add('hidden');
            dateCard.classList.remove('hidden');
            
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            datePicker.min = now.toISOString().slice(0, 16);
            datePicker.value = now.toISOString().slice(0, 16);
        });

        // თარიღის დადასტურება
        submitDate.addEventListener('click', () => {
            const selectedDate = new Date(datePicker.value);
            
            if (!datePicker.value) {
                alert('დრო მაინც აარჩიე, კაი კაცო 🥦');
                return;
            }

            const options = { weekday: 'long', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            const formattedDate = selectedDate.toLocaleDateString('ka-GE', options);

            dateCard.classList.add('hidden');
            finalCard.classList.remove('hidden');
            finalMessage.innerHTML = `მოკლედ, რიზლას და გრინდერს ვამზადებ <br><strong>${formattedDate}</strong>-ზე! 🚀`;
        });
    </script>
</body>
</html>
