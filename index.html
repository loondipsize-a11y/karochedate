<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>წამოხვალ დეითზე? ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe5ec, #ffb3c6);
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
            transition: all 0.3s ease;
        }

        h1 {
            color: #ff477e;
            margin-bottom: 20px;
            font-size: 2rem;
        }

        p {
            color: #4f5d75;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 60px;
        }

        button {
            padding: 12px 35px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s ease;
        }

        #yesBtn {
            background-color: #ff477e;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 71, 126, 0.4);
        }

        #yesBtn:hover {
            background-color: #ff7096;
            transform: scale(1.05);
        }

        #noBtn {
            background-color: #e2eafc;
            color: #4f5d75;
            position: absolute;
            white-space: nowrap;
        }

        /* მეორე გვერდის სტილები (კალენდარი) */
        .hidden {
            display: none !important;
        }

        input[type="datetime-local"] {
            padding: 12px;
            border: 2px solid #ffb3c6;
            border-radius: 10px;
            font-size: 1rem;
            color: #4f5d75;
            outline: none;
            margin-bottom: 20px;
            width: 100%;
        }

        input[type="datetime-local"]:focus {
            border-color: #ff477e;
        }

        #submitDate {
            background-color: #2ec4b6;
            color: white;
            width: 100%;
            box-shadow: 0 5px 15px rgba(46, 196, 182, 0.4);
        }

        #submitDate:hover {
            background-color: #3bd6c6;
        }

        .success-gif {
            font-size: 3rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <!-- პირველი ეტაპი: კითხვა -->
    <div id="questionCard" class="card">
        <div style="font-size: 4rem; margin-bottom: 10px;">✨</div>
        <h1>წამოხვალ ჩემთან დეითზე?</h1>
        <p>არჩევანის უფლება გაქვს, მაგრამ კარგად დაფიქრდი! 😉</p>
        
        <div class="btn-container">
            <button id="yesBtn">კი 🥰</button>
            <button id="noBtn">არა 👁️👄👁️</button>
        </div>
    </div>

    <!-- მეორე ეტაპი: დროის არჩევა -->
    <div id="dateCard" class="card hidden">
        <div class="success-gif">🎉</div>
        <h1>იდეალურია!</h1>
        <p>ახლა კი აარჩიე შენთვის მოსახერხებელი დღე და საათი:</p>
        
        <input type="datetime-local" id="datePicker">
        <button id="submitDate">დადასტურება ✨</button>
    </div>

    <!-- მესამე ეტაპი: ფინალი -->
    <div id="finalCard" class="card hidden">
        <div class="success-gif">❤️🥳</div>
        <h1>შევთანხმდით!</h1>
        <p id="finalMessage"></p>
    </div>

    <script>
        const questionCard = document.getElementById('questionCard');
        const dateCard = document.getElementById('dateCard');
        const finalCard = document.getElementById('finalCard');
        
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const submitDate = document.getElementById('submitDate');
        const datePicker = document.getElementById('datePicker');
        const finalMessage = document.getElementById('finalMessage');

        // "არა" ღილაკის გაქცევის ლოგიკა
        function moveNoButton() {
            // ეკრანის ზომების გათვალისწინება, რომ ღილაკი ეკრანს გარეთ არ გავარდეს
            const padding = 50;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            
            // შემთხვევითი კოორდინატები (ცენტრიდან მოშორებით)
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            // ღილაკის გადაადგილება absolute პოზიციონირებით მთელ ეკრანზე
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // მობილურზეც და კომპიუტერზეც რომ იმუშაოს
        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // რომ არ დაეჭიროს ეგრევე
            moveNoButton();
        });

        // "კი" ღილაკზე დაჭერა
        yesBtn.addEventListener('click', () => {
            questionCard.classList.add('hidden');
            dateCard.classList.remove('hidden');
            
            // კალენდარში დეფოლტად დღევანდელი დღე რომ ჩაჯდეს
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            datePicker.min = now.toISOString().slice(0, 16);
            datePicker.value = now.toISOString().slice(0, 16);
        });

        // თარიღის დადასტურება
        submitDate.addEventListener('click', () => {
            const selectedDate = new Date(datePicker.value);
            
            if (!datePicker.value) {
                alert('გთხოვს აარჩიო დრო 🥺');
                return;
            }

            // ფორმატირება ლამაზად წასაკითხად
            const options = { weekday: 'long', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            const formattedDate = selectedDate.toLocaleDateString('ka-GE', options);

            dateCard.classList.add('hidden');
            finalCard.classList.remove('hidden');
            finalMessage.innerHTML = `მოკლედ, გელოდები: <br><strong>${formattedDate}</strong>-ზე! 🚀`;
        });
    </script>
</body>
</html>
